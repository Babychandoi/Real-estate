# Shared by every location that proxies to the backend.
proxy_http_version 1.1;
proxy_set_header Host $host;

# $remote_addr is the client address resolved by the realip module (nginx.conf), i.e. Cloudflare's
# CF-Connecting-IP when the request came through the tunnel. Both headers carry that single value, so nothing a
# client sends in X-Forwarded-For reaches the backend. The backend believes them only from trusted proxies
# (app.security.trusted-proxies).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $bds_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

# Nginx sets the browser security headers itself (security-headers.conf); drop the backend's copies so a response
# never carries two different values of the same header.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Opener-Policy;
