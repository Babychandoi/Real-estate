# Browser security headers for every response (audit F11).
#
# Nginx does not merge add_header directives: a location that declares any add_header of its own (Cache-Control,
# X-Accel-Buffering, ...) silently drops everything inherited from the server block. nginx.conf therefore includes
# this file at server level AND in every location. "always" also covers 4xx/5xx responses.
#
# $bds_csp and $bds_hsts are maps in nginx.conf: the SPA policy or a locked-down one for API responses, and HSTS
# only when the visitor reached the edge over HTTPS (an empty value emits no header).
add_header Content-Security-Policy $bds_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $bds_hsts always;
