# Edge for Nhà Đất Chuẩn: serves the SPA and proxies /api to the Compose service "backend".
# The official nginx image includes /etc/nginx/conf.d/*.conf inside its http {} block, so the realip, map and
# log_format directives below are http-level. Includes live in /etc/nginx/bds/ (frontend/nginx/ in the repo).
# Verify the served headers with scripts/verify-headers.sh <baseUrl>.

# --- Real client address (audit F13.1) -------------------------------------------------------------------------
# Only these peers may assert the client address: loopback and the Docker bridge pools, i.e. cloudflared in the
# Compose network and the host through the loopback-only port publish. cloudflared forwards Cloudflare's
# CF-Connecting-IP, which the Cloudflare edge always sets itself, so it cannot be forged from the internet.
# Anyone else is recorded by the socket address. If the origin is ever exposed to Cloudflare directly (no
# tunnel), add Cloudflare's published ranges here instead of widening these.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Scheme the visitor used at the edge (Cloudflare sends X-Forwarded-Proto and CF-Visitor; the tunnel hop is HTTP).
map "$http_x_forwarded_proto|$http_cf_visitor" $bds_forwarded_proto {
    default $scheme;
    "~*^https" https;
    "~*\"scheme\":\"https\"" https;
}

# HSTS only for HTTPS visitors; an empty value makes add_header emit nothing.
map $bds_forwarded_proto $bds_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

# --- Content-Security-Policy per response family (audit F11) ---------------------------------------------------
# SPA: fonts are self-hosted; the only third parties are OpenFreeMap (style, tiles, glyphs, sprites fetched by the
# MapLibre worker), VietQR payment images and the Cloudflare Web Analytics beacon. API responses are data, never
# documents, so they get a policy that allows nothing; public media only needs to render in its own tab.
map $uri $bds_csp {
    default "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.vietqr.io https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://cloudflareinsights.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; media-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    "~^/api/v1/public/media/" "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    "~^/api/" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
}

# Hashed build assets are immutable for a year; an error for a missing asset must never be cached that long.
map $status $bds_asset_cache_control {
    default "no-store";
    "~^[23]" "public, max-age=31536000, immutable";
}

# --- Privacy-preserving access log ------------------------------------------------------------------------------
# With realip on, $remote_addr is the visitor. Log it truncated (IPv4 /24; IPv6 only its first two groups, a /32,
# which also holds for compressed forms such as 2a02::5) and log the path without the query string: verification and
# password-reset links carry one-time tokens there.
map $remote_addr $bds_log_client {
    "~^(?<bds_ip4_net>\d+\.\d+\.\d+)\.\d+$" "${bds_ip4_net}.0";
    "~^(?<bds_ip6_a>[0-9A-Fa-f]{1,4}):(?<bds_ip6_b>[0-9A-Fa-f]{1,4}):" "${bds_ip6_a}:${bds_ip6_b}::/32";
    "~^(?<bds_ip6_c>[0-9A-Fa-f]{1,4})::" "${bds_ip6_c}::/32";
    "~^::" "::/32";
    default "-";
}
map $request_uri $bds_log_path {
    "~^(?<bds_path_only>[^?]*)" $bds_path_only;
    default "-";
}
log_format bds_privacy '$bds_log_client [$time_iso8601] "$request_method $bds_log_path $server_protocol" '
                       '$status $body_bytes_sent $request_time $upstream_response_time "$http_user_agent" '
                       'ray=$http_cf_ray';

server {
    listen 3000;
    server_tokens off;
    access_log /var/log/nginx/access.log bds_privacy;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 12m;
    keepalive_timeout 30s;

    # Responses produced at server level. Every location below repeats the include (see security-headers.conf).
    include /etc/nginx/bds/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/bds/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }

    location = /backend-health {
        access_log off;
        include /etc/nginx/bds/proxy-backend.conf;
        include /etc/nginx/bds/security-headers.conf;
        proxy_pass http://backend:8080/actuator/health/readiness;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /sitemap.xml {
        include /etc/nginx/bds/proxy-backend.conf;
        include /etc/nginx/bds/security-headers.conf;
        proxy_pass http://backend:8080/api/v1/public/seo/sitemap.xml;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/bds/security-headers.conf;
        add_header Cache-Control $bds_asset_cache_control always;
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/bds/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Server-sent events: unbuffered and long-lived. The backend decides caching (no-store).
    location = /api/v1/notifications/stream {
        include /etc/nginx/bds/proxy-backend.conf;
        include /etc/nginx/bds/security-headers.conf;
        add_header X-Accel-Buffering "no" always;
        proxy_pass http://backend:8080/api/v1/notifications/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        error_page 502 503 504 = @api_unavailable;
    }

    # API: the backend decides Cache-Control (private areas are no-store, public media is immutable).
    location /api/ {
        include /etc/nginx/bds/proxy-backend.conf;
        include /etc/nginx/bds/security-headers.conf;
        proxy_pass http://backend:8080/api/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 503 504 = @api_unavailable;
    }

    # Backend down or restarting: API clients get Problem Details instead of Nginx's HTML error page.
    location @api_unavailable {
        include /etc/nginx/bds/security-headers.conf;
        default_type "application/problem+json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 503 '{"type":"https://api.bds.vn/problems/service-unavailable","title":"Dịch vụ tạm gián đoạn","status":503,"detail":"Máy chủ đang khởi động lại hoặc quá tải. Vui lòng thử lại sau ít phút.","code":"SERVICE_UNAVAILABLE"}';
    }

    # SPA routes and other static files: always revalidated so a deploy is picked up immediately.
    location / {
        root /usr/share/nginx/html;
        include /etc/nginx/bds/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
