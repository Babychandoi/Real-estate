server {
  listen 3000;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 10m;
  keepalive_timeout 30s;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://img.vietqr.io https://tiles.openfreemap.org data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://tiles.openfreemap.org https://static.cloudflareinsights.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /backend-health {
    access_log off;
    proxy_pass http://backend:8080/actuator/health/readiness;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location /assets/ { root /usr/share/nginx/html; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
