# W6-PERF: override for the isolated load-test stack only (scripts/ci-mixed-load.sh). Loads pg_stat_statements so the
# harness can count SQL statements per request type; every other PostgreSQL setting stays at the image default used by
# docker-compose.yml. Never used for the demo or production stacks.
services:
  postgres:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top",
              "-c", "pg_stat_statements.max=10000", "-c", "track_io_timing=on"]
