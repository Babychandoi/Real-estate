apiVersion: apps/v1
kind: Deployment
metadata: { name: bds-backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: bds-backend } }
  template:
    metadata: { labels: { app: bds-backend } }
    spec:
      containers:
        - name: backend
          image: registry.example.invalid/bds-backend:replace-with-digest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: bds-runtime-secrets } }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: bds-backend }
spec:
  selector: { app: bds-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: bds-backend }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: bds-backend } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: bds-backend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bds-backend }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

