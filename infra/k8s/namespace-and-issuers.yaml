apiVersion: v1
kind: Namespace
metadata: { name: bds }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: bds-local-ca-bootstrap }
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: bds-local-ca, namespace: cert-manager }
spec:
  isCA: true
  commonName: BDS Local Kubernetes CA
  secretName: bds-local-ca
  issuerRef: { name: bds-local-ca-bootstrap, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: bds-local-ca }
spec:
  ca:
    secretName: bds-local-ca
