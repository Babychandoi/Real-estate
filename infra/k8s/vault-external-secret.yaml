apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: bds-vault, namespace: bds }
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc.cluster.local:8200
      path: bds
      version: v2
      auth:
        tokenSecretRef:
          name: vault-reader-token
          key: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: bds-runtime-from-vault, namespace: bds }
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef: { name: bds-vault, kind: SecretStore }
  target:
    name: bds-runtime-secrets
    creationPolicy: Owner
  dataFrom:
    - extract: { key: production/runtime }
