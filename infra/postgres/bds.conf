# Main PostgreSQL configuration used by the ops overlays (infra/compose.observability.yaml, infra/compose.pitr.yaml).
# Both start postgres with `-c config_file=/etc/postgresql/bds.conf`, so they can be combined in any order: each one
# only mounts its own snippet below. The initdb-generated file (memory, connections, locale) is loaded first and
# postgresql.auto.conf (ALTER SYSTEM) is still applied last by PostgreSQL itself. Assumes the image default PGDATA.
include '/var/lib/postgresql/data/postgresql.conf'
include_if_exists '/etc/postgresql/conf.d/observability.conf'
include_if_exists '/etc/postgresql/conf.d/pitr.conf'
