# Slow-query and lock visibility (audit D-14), mounted by infra/compose.observability.yaml.
# Statements slower than 500 ms are logged with their duration; parameters are not logged (they may contain PII).
log_min_duration_statement = 500ms
log_parameter_max_length = 0
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 10MB
log_autovacuum_min_duration = 10s
log_checkpoints = on
track_io_timing = on
# pg_stat_statements feeds the "top queries" panel. Requires a restart, then once per database:
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
