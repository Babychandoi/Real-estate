# Continuous WAL archiving for point-in-time recovery (audit F21.2/F21.5), mounted by infra/compose.pitr.yaml.
# basic_archive (contrib, PostgreSQL 15+) copies each completed segment atomically and fsyncs it, unlike a cp-based
# archive_command. archive_timeout forces a segment switch every 5 minutes, so at most ~5 minutes of commits are
# only in pg_wal (RPO for a lost data volume, provided the archive survives). See docs/ops/PRODUCTION_TOPOLOGY.md.
wal_level = replica
archive_mode = on
archive_library = 'basic_archive'
basic_archive.archive_directory = '/var/lib/postgresql/wal-archive'
archive_timeout = 300
