# Observability for Nhà Đất Chuẩn (audit D-14): Prometheus, Alertmanager, Grafana with provisioned dashboards and
# PostgreSQL / Redis / Elasticsearch / host exporters. Overlay for the root docker-compose.yml; paths are relative to
# the repository root. Every UI is bound to loopback only (reach it through an SSH tunnel from another machine).
#
#   GRAFANA_ADMIN_PASSWORD=... [BACKUP_METRICS_DIR=$BACKUP_DIR/metrics] \
#   docker compose -p bds-production -f docker-compose.yml -f infra/compose.observability.yaml --profile observability up -d
#
#   Grafana      http://127.0.0.1:3001  (dashboards in folder "BDS")
#   Prometheus   http://127.0.0.1:9090  (alerts: /alerts)
#   Alertmanager http://127.0.0.1:9093  (no receiver configured; see infra/observability/alertmanager.yml)
#
# Including this file also restarts PostgreSQL once with slow-query logging (> 500 ms, without parameter values),
# lock-wait logging and pg_stat_statements (infra/postgres/conf.d/observability.conf); the one-shot
# postgres-stat-statements job then creates the extension. Least privilege (recommended): a monitoring role
#   CREATE ROLE bds_monitor LOGIN PASSWORD '...' IN ROLE pg_monitor;
# passed as PG_EXPORTER_USER / PG_EXPORTER_PASSWORD; by default the exporter uses the application credentials.
# Alert runbooks: docs/operations/ALERT_RUNBOOK.md.
services:
  postgres:
    command: ["postgres", "-c", "config_file=/etc/postgresql/bds.conf"]
    volumes:
      - ./infra/postgres/bds.conf:/etc/postgresql/bds.conf:ro
      - ./infra/postgres/conf.d/observability.conf:/etc/postgresql/conf.d/observability.conf:ro

  postgres-stat-statements:
    profiles: ["observability"]
    image: postgis/postgis:16-3.4
    restart: "no"
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-c", "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-bds}
      PGUSER: ${POSTGRES_USER:-bds}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [bds-network]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 768m
    networks: [bds-network]

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 128m
    networks: [bds-network]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bds-api.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 384m
    depends_on: [prometheus]
    networks: [bds-network]

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    command: ["--collector.stat_statements", "--collector.long_running_transactions"]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-bds}?sslmode=disable
      DATA_SOURCE_USER: ${PG_EXPORTER_USER:-${POSTGRES_USER:-bds}}
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
    mem_limit: 64m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [bds-network]

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.74.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    mem_limit: 64m
    networks: [bds-network]

  elasticsearch-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/elasticsearch-exporter:v1.9.0
    restart: unless-stopped
    command: ["--es.uri=http://elasticsearch:9200", "--es.indices", "--es.timeout=10s"]
    mem_limit: 64m
    networks: [bds-network]

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    volumes:
      - /:/host:ro
      - ${BACKUP_METRICS_DIR:-./infra/observability/textfile}:/textfile:ro
    mem_limit: 64m
    networks: [bds-network]

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
