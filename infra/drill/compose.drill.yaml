# Isolated restore target for scripts/restore-drill.sh (audit F21.2/F21.5). Project name bds-drill, separate from
# the production/demo/test projects: own network, nothing published on the host, anonymous volumes removed by
# `docker compose -p bds-drill -f infra/drill/compose.drill.yaml down -v`. Versions match production.
name: bds-drill
services:
  postgres:
    image: postgis/postgis:16-3.4
    # postgis publishes amd64 only (emulated on Apple Silicon, like infra/test/compose.yaml).
    platform: ${DRILL_POSTGRES_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill-only-password
      POSTGRES_DB: drill_admin
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    mem_limit: 512m
    healthcheck:
      # TCP, not the socket: on first start the entrypoint runs a socket-only temporary server for its init scripts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U drill -d drill_admin"]
      interval: 2s
      timeout: 3s
      retries: 90
  minio:
    image: ${DRILL_MINIO_IMAGE:-bds-minio:RELEASE.2025-10-15T17-29-55Z}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: drill-admin
      MINIO_ROOT_PASSWORD: drill-admin-only-password
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 90
