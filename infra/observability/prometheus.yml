# Prometheus for Nhà Đất Chuẩn (audit D-14), used by infra/compose.observability.yaml. Every target is a service
# name on the Compose network; nothing here is reachable from outside the host.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: bds-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: elasticsearch
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
