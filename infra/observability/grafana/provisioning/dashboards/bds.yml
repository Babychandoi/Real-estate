# Dashboards are files in infra/observability/grafana/dashboards (mounted read-only). Change them in Git, not in
# the UI: UI edits are not saved back.
apiVersion: 1
providers:
  - name: bds
    orgId: 1
    folder: BDS
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
