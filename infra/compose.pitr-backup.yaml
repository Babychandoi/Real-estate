# Off-host PITR material: archived WAL segments (zstd + age, every 5 minutes) and a daily physical base backup, both
# into BACKUP_DIR. Use together with compose.backup.yaml and compose.pitr.yaml:
#   docker compose -p bds-production -f docker-compose.yml -f infra/compose.apple-silicon.yaml -f infra/compose.pitr.yaml \
#     -f infra/compose.backup.yaml -f infra/compose.pitr-backup.yaml --profile ops up -d postgres backup postgres-basebackup
# PostgreSQL writes archived segments with mode 0600 as uid 999, so both services run as that uid; on a Linux host
# prepare BACKUP_DIR with `chown 999:999` (Docker Desktop needs nothing). Restore procedure and RPO/RTO:
# docs/ops/PRODUCTION_TOPOLOGY.md ("PITR").
services:
  backup:
    user: "${BACKUP_UID:-999}:${BACKUP_GID:-999}"
    environment:
      WAL_ARCHIVE_DIR: /wal-archive
      WAL_INTERVAL_SECONDS: ${BACKUP_WAL_INTERVAL_SECONDS:-300}
      RETENTION_WAL_DAYS: ${BACKUP_RETENTION_WAL_DAYS:-7}
      # Local segments are deleted only once shipped and older than this.
      WAL_ARCHIVE_PRUNE_MINUTES: ${WAL_ARCHIVE_KEEP_MINUTES:-4320}
    volumes:
      - postgres-wal-archive:/wal-archive
  postgres-wal-archive-prune:
    # With shipping on, the age-based pruner is only a backstop against a full disk if shipping stops for a week
    # (BdsWalShippingStale alerts after 30 minutes).
    environment:
      KEEP_MINUTES: ${WAL_ARCHIVE_KEEP_MINUTES_UNSHIPPED:-10080}
  postgres-basebackup:
    # Shares PostgreSQL's network namespace: pg_basebackup connects to 127.0.0.1, where the image's default
    # pg_hba.conf accepts local replication; nothing else can reach it.
    profiles: ["ops"]
    build: { context: ./infra/backup }
    image: bds-backup:1
    restart: ${BDS_RESTART_POLICY:-unless-stopped}
    user: "${BACKUP_UID:-999}:${BACKUP_GID:-999}"
    network_mode: "service:postgres"
    command: ["schedule"]
    environment:
      SCHEDULE_JOBS: basebackup
      BACKUP_ENV: ${BACKUP_ENV:-production}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bds}
      PGDATABASE: ${POSTGRES_DB:-bds}
      AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:?Set BACKUP_AGE_RECIPIENTS to the age public key(s), never the private key}
      BASEBACKUP_INTERVAL_SECONDS: ${BACKUP_BASEBACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_BASE_DAYS: ${BACKUP_RETENTION_BASE_DAYS:-7}
      RETENTION_MIN_SETS: ${BACKUP_RETENTION_MIN_SETS:-3}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${BACKUP_DIR:?Set BACKUP_DIR to a host directory outside the repository}:/backups
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
