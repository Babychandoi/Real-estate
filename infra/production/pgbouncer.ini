[databases]
bds = host=postgres port=5432 dbname=bds

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer_userlist
pool_mode = transaction
max_client_conn = 500
default_pool_size = 40
reserve_pool_size = 10
server_reset_query = DISCARD ALL
