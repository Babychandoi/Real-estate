name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent gates: backend-tests, frontend-checks, e2e and security-scan run in parallel and report on their own,
# so a failure in one never hides the result of another. Every E2E suite is its own step with its own report.
jobs:
  backend-tests:
    # Integration tests run on PostgreSQL/PostGIS + Flyway (no H2). The service containers mirror
    # infra/test/compose.yaml and expose the same BDS_TEST_* variables as `scripts/test-infra.sh env`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bds_test
          POSTGRES_PASSWORD: bds_test_only
          POSTGRES_DB: bds_test_admin
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U bds_test -d bds_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports: ['59200:9200']
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ['51025:1025', '58025:8025']
    env:
      BDS_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55432/bds_test_admin
      BDS_TEST_PG_USER: bds_test
      BDS_TEST_PG_PASSWORD: bds_test_only
      BDS_TEST_ES_URL: http://127.0.0.1:59200
      BDS_TEST_REDIS_HOST: 127.0.0.1
      BDS_TEST_REDIS_PORT: '56379'
      # Service containers cannot pass --databases 64, and CI runs one JVM per job: pin the index.
      BDS_TEST_REDIS_DB: '1'
      BDS_TEST_SMTP_HOST: 127.0.0.1
      BDS_TEST_SMTP_PORT: '51025'
      BDS_TEST_MAILPIT_API: http://127.0.0.1:58025
      BDS_TEST_MINIO_URL: http://127.0.0.1:59000
      BDS_TEST_MINIO_USER: bds-test-media
      BDS_TEST_MINIO_PASSWORD: bds-test-media-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start test MinIO
        run: |
          docker build -t bds-minio:RELEASE.2025-10-15T17-29-55Z infra/minio
          docker compose -f infra/test/compose.yaml up -d minio
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:59000/minio/health/ready
      - name: Backend tests
        working-directory: backend
        run: sh mvnw --batch-mode verify
      - name: Stop test MinIO
        if: always()
        run: docker compose -f infra/test/compose.yaml down -v
      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        id: install
        run: npm ci
      # Each check runs even when an earlier one failed, so one run shows every problem.
      - name: Audit dependencies (high and critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Lint (ESLint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck (tsc)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Formatting (Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: API contract (types generated from the backend's OpenAPI snapshot)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:api
      - name: Unit tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit/junit.xml
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Route bundle budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle
      - name: Upload unit test results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-junit-${{ github.run_attempt }}
          path: frontend/test-results/unit/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE_ARGS: --env-file .env.demo.example
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # The frontend image is built with the UI catalog: its a11y checks must run, never skip.
      E2E_REQUIRE_UI_CATALOG: '1'
      # Demo staff accounts have no authenticator; MFA itself is covered by AdminMfaTests and the Vitest suite.
      APP_SECURITY_MFA_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build images (frontend with the /__ui catalog)
        run: |
          docker compose $COMPOSE_FILE_ARGS build backend
          docker compose $COMPOSE_FILE_ARGS build --build-arg VITE_ENABLE_UI_CATALOG=true frontend
      - name: Start integration stack
        run: docker compose $COMPOSE_FILE_ARGS up -d --wait
      - name: Seed fixture data (UAT seeder, fixed clock)
        # The running stack created the demo accounts; this one-off container adds deterministic listings, leads,
        # reports and orders for them and exits.
        run: >-
          docker compose $COMPOSE_FILE_ARGS run --rm --no-deps backend
          --app.uat-seed.mode=seed
          --app.uat-seed.accounts=demo.broker@bds.local,demo.user@bds.local,demo.moderator@bds.local,demo.admin@bds.local
          --app.uat-seed.kyc-verified-accounts=demo.broker@bds.local,demo.user@bds.local
          --app.uat-seed.password=$(grep '^DEMO_ACCOUNT_PASSWORD=' .env.demo.example | cut -d= -f2-)
          --app.uat-seed.clock=2026-09-01T03:00:00Z
          --server.port=18080
      - name: Re-index search with the seeded listings
        # The backend syncs Elasticsearch at start-up (and every 60 s); a restart makes the index match the seed
        # before any test runs instead of waiting for the next sync.
        run: |
          docker compose $COMPOSE_FILE_ARGS restart backend
          docker compose $COMPOSE_FILE_ARGS restart frontend
          docker compose $COMPOSE_FILE_ARGS up -d --wait
      - name: Wait for the search index
        # The backend is healthy before Elasticsearch has taken the seeded listings; until then search answers from
        # the database with degraded=true and the page shows a maintenance notice, which made the visual baselines
        # depend on timing. Wait for the real engine so every test (and every baseline) sees the same page.
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS "http://127.0.0.1:3000/api/v2/listings/search" || true)
            if echo "$body" | grep -q '"degraded":false'; then echo "search index ready after $((i * 3)) s"; exit 0; fi
            sleep 3
          done
          echo "search index not ready after 180 s: $body"
          exit 1
      - name: Install Playwright browsers
        id: browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: 'E2E: navigation'
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: navigation
        run: npx playwright test tests/e2e/navigation.spec.ts
      - name: 'E2E: accessibility and responsive containment'
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: a11y
        run: npx playwright test tests/e2e/a11y.spec.ts
      - name: 'E2E: authentication dialog'
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: auth-dialog
        run: npx playwright test tests/e2e/auth-dialog.spec.ts
      - name: 'E2E: signed-in buyer and broker'
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: authenticated
        # One desktop project: /auth/* is rate limited per IP and these are smoke flows, not layout checks.
        run: |
          export DEMO_ACCOUNT_PASSWORD="$(grep '^DEMO_ACCOUNT_PASSWORD=' ../.env.demo.example | cut -d= -f2-)"
          npx playwright test tests/e2e/authenticated.spec.ts --project=chromium-1440
      - name: 'E2E: 360/1024 reflow and authenticated accessibility'
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: responsive-a11y
        # One desktop project, with explicit viewport changes. A single buyer/moderator login avoids auth rate limits.
        run: |
          export DEMO_ACCOUNT_PASSWORD="$(grep '^DEMO_ACCOUNT_PASSWORD=' ../.env.demo.example | cut -d= -f2-)"
          npx playwright test tests/e2e/responsive-auth-a11y.spec.ts --project=chromium-1440
      - name: 'E2E: visual regression (chromium)'
        id: visual
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        # S11 reviewed the diffs and committed fresh baselines for every chromium-engine project (chromium-320/768/
        # 1440, android-chrome runs on chromium too); blocking now (F01.5).
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: visual
        run: npx playwright test tests/e2e/visual.spec.ts --project=chromium-320 --project=chromium-768 --project=chromium-1440 --project=android-chrome
      - name: Upload Chromium visual diffs for review
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-visual-diffs-${{ github.run_attempt }}
          path: |
            frontend/test-results/visual/artifacts/**/*-actual.png
            frontend/test-results/visual/artifacts/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore
      - name: 'E2E: visual regression (firefox, webkit)'
        id: visual-other-engines
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        # Not blocking: these baselines are still the ones from before the UI redesign (S11 could only review and
        # regenerate chromium-engine projects locally, per its wave's chromium-only constraint). The diffs are still
        # uploaded below so a future stream can review and commit them, the same way S11 did for chromium.
        continue-on-error: true
        working-directory: frontend
        env:
          PLAYWRIGHT_SUITE: visual
        run: npx playwright test tests/e2e/visual.spec.ts --project=ios-safari --project=webkit-desktop --project=firefox-desktop
      - name: S10 query plans (isolated 100k and 1M)
        timeout-minutes: 15
        env:
          BDS_PERF_ISOLATED: '1'
        run: bash scripts/ci-search-explain.sh
      - name: Upload S10 query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s10-query-plans-${{ github.run_attempt }}
          path: |
            .artifacts/perf/environment.txt
            .artifacts/perf/explain-search-*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Collect stack logs
        if: ${{ failure() || steps.visual-other-engines.outcome == 'failure' }}
        run: |
          mkdir -p frontend/test-results
          docker compose $COMPOSE_FILE_ARGS logs --no-color > frontend/test-results/compose.log 2>&1 || true
      - name: Upload Playwright reports, traces and screenshot diffs
        if: ${{ failure() || steps.visual-other-engines.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-${{ github.run_attempt }}
          path: frontend/test-results/*/junit.xml
          if-no-files-found: ignore
      - name: Stop integration stack
        if: always()
        run: docker compose $COMPOSE_FILE_ARGS down -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
