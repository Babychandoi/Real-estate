name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - name: Frontend checks
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high && npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Visual regression and accessibility
        working-directory: frontend
        run: npm run test:e2e
      - name: Build images
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          REDIS_PASSWORD: ci-only-redis-not-for-production
          DEMO_ACCOUNT_PASSWORD: ci-only-demo-password-not-for-production
          MINIO_ROOT_USER: ci-media
          MINIO_ROOT_PASSWORD: ci-only-minio-password-not-for-production
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
