name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: sh mvnw --batch-mode verify
      - name: Frontend checks
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high && npm run lint && npm run build
      - name: Start integration stack
        run: docker compose --env-file .env.demo.example up -d --build --wait
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Visual regression and accessibility
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
      - name: Stop integration stack
        if: always()
        run: docker compose --env-file .env.demo.example down -v
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
