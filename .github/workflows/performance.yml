name: Isolated performance evidence

on:
  pull_request:
    paths:
      - ".github/workflows/performance.yml"
      - "scripts/ci-mixed-load.sh"
      - "scripts/ci-query-plans.sh"
      - "scripts/query-plans.py"
      - "scripts/plan-compare.py"
      - "scripts/query-counts.py"
      - "scripts/perf-metrics.py"
      - "scripts/k6-timeline.py"
      - "backend/src/main/java/com/company/bds/search/**"
      - "scripts/perf-summary.py"
      - "scripts/perf_summary_test.py"
      - "infra/k6/mixed-search-drafts.js"
      - "infra/perf/**"
      - "backend/src/main/resources/db/migration/**"
  workflow_dispatch:
    inputs:
      suites:
        description: Which evidence to collect on disposable GitHub-hosted runners
        type: choice
        options: [all, plans, load]
        default: all
      listings:
        description: Public listings in the load-test dataset
        type: string
        default: "100000"
      soak:
        description: Soak duration (constant arrival 100 reads/s + 10 writes/s), e.g. 10m
        type: string
        default: "10m"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query-plans:
    if: ${{ github.event_name == 'pull_request' || inputs.suites != 'load' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BDS_PERF_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          bash -n scripts/ci-query-plans.sh
          python3 -B -m py_compile scripts/query-plans.py scripts/plan-compare.py
      - name: EXPLAIN (ANALYZE, BUFFERS) at 100k and 1M listings, warm and cold
        run: bash scripts/ci-query-plans.sh
      - name: Upload query plans
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: query-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/query-plans/
          if-no-files-found: error
          retention-days: 30

  mixed-load:
    if: ${{ github.event_name == 'pull_request' || inputs.suites != 'plans' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [steady, faults]
    env:
      BDS_PERF_ISOLATED: "1"
      SUITE: ${{ matrix.suite }}
      PERF_LISTINGS: ${{ inputs.listings || '100000' }}
      PERF_SOAK: ${{ inputs.soak || '10m' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          bash -n scripts/ci-mixed-load.sh
          python3 -B scripts/perf_summary_test.py
          python3 -B -m py_compile scripts/query-counts.py scripts/perf-metrics.py
      - name: Measure and verify persisted effects
        run: bash scripts/ci-mixed-load.sh
      - name: Upload completed and failed-run evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mixed-load-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/mixed-load/
          if-no-files-found: error
          retention-days: 30
