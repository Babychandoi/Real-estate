name: Isolated mixed-load evidence

on:
  pull_request:
    paths:
      - ".github/workflows/performance.yml"
      - "scripts/ci-mixed-load.sh"
      - "scripts/perf-summary.py"
      - "scripts/perf_summary_test.py"
      - "infra/k6/mixed-search-drafts.js"
      - "infra/perf/verify-draft-writes.sql"
  workflow_dispatch:
    inputs:
      profile:
        description: Workload on disposable GitHub-hosted infrastructure
        type: choice
        options: [steady, burst, soak]
        default: steady

permissions:
  contents: read

concurrency:
  group: mixed-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BDS_PERF_ISOLATED: "1"
      PROFILE: ${{ inputs.profile || 'steady' }}
      # PRs get a one-minute diagnostic; manual steady runs use the full five minutes.
      PERF_DURATION: ${{ github.event_name == 'pull_request' && '1m' || '5m' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          bash -n scripts/ci-mixed-load.sh
          python3 -B scripts/perf_summary_test.py
      - name: Measure and verify persisted effects
        run: bash scripts/ci-mixed-load.sh
      - name: Upload completed and failed-run evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mixed-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/mixed-load/
          if-no-files-found: error
          retention-days: 30
