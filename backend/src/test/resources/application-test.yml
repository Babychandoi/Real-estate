# Integration tests run on PostgreSQL/PostGIS with the real Flyway migrations (no H2).
# The datasource URL is injected by BdsIntegrationTestInitializer, which creates a fresh database
# bds_it_<timestamp>_<random> on the shared test server (BDS_TEST_PG_URL) once per JVM and drops it on exit.
# Every other external service points at the shared test infrastructure (scripts/test-infra.sh env), never at
# the default localhost ports used by the demo/production stacks.
spring:
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      # The database index is claimed per JVM by BdsTestRedis (16..63 unless BDS_TEST_REDIS_DB is set) and flushed.
      host: ${BDS_TEST_REDIS_HOST:127.0.0.1}
      port: ${BDS_TEST_REDIS_PORT:56379}
  mail:
    host: ${BDS_TEST_SMTP_HOST:127.0.0.1}
    port: ${BDS_TEST_SMTP_PORT:51025}
  elasticsearch:
    uris: ${BDS_TEST_ES_URL:http://127.0.0.1:59200}

app:
  seo:
    # A copy of the built SPA shell (the real one comes from Nginx: http://frontend:3000/index.html).
    shell-location: classpath:seo/test-shell.html
  cms:
    # Tests call CmsArticleApplicationService.publishDue directly.
    publish-initial-delay: PT24H
  billing:
    quota-enforced: false
  listing:
    require-verified-kyc: false
    freshness:
      # Tests call ListingFreshnessService sweeps directly with a chosen instant.
      scheduler-enabled: false
  mode: test
  security:
    rate-limit:
      # Every MockMvc request comes from 127.0.0.1, so unrelated suites would share one IP budget. The rate-limit
      # suites (shared.security.RequestRateLimit*Tests) set this back to 1 and test the real limits.
      limit-multiplier: 1000
  features:
    real-kyc: true
    real-transactions: true
  engagement:
    # Tests call AlertDigestService directly.
    scheduler-enabled: false
  audit:
    chain:
      # Tests link the audit chain explicitly (AuditTrail.linkAll).
      scheduler-enabled: false
  jobs:
    # Tests drive the worker explicitly (JobWorker.drain) so they never race a background poller.
    enabled: false
  search:
    elasticsearch:
      # Opt in per test with @BdsIntegrationTest(properties = "bds.test.elasticsearch=true").
      enabled: false
  analytics:
    ingestion:
      # Off by default in the application (kill switch until S5's rate-limit policy exists); tests exercise it.
      enabled: true
    maintenance:
      # Tests call AnalyticsMaintenanceService directly.
      enabled: false
