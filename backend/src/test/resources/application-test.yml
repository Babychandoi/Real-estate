# Integration tests run on PostgreSQL/PostGIS with the real Flyway migrations (no H2).
# The datasource URL is injected by BdsIntegrationTestInitializer, which creates a fresh database
# bds_it_<timestamp>_<random> on the shared test server (BDS_TEST_PG_URL) once per JVM and drops it on exit.
# Every other external service points at the shared test infrastructure (scripts/test-infra.sh env), never at
# the default localhost ports used by the demo/production stacks.
spring:
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${BDS_TEST_REDIS_HOST:127.0.0.1}
      port: ${BDS_TEST_REDIS_PORT:56379}
      database: ${BDS_TEST_REDIS_DB:1}
  mail:
    host: ${BDS_TEST_SMTP_HOST:127.0.0.1}
    port: ${BDS_TEST_SMTP_PORT:51025}
  elasticsearch:
    uris: ${BDS_TEST_ES_URL:http://127.0.0.1:59200}

app:
  billing:
    quota-enforced: false
  listing:
    require-verified-kyc: false
  mode: test
  features:
    real-kyc: true
    real-transactions: true
  jobs:
    # Tests drive the worker explicitly (JobWorker.drain) so they never race a background poller.
    enabled: false
  search:
    elasticsearch:
      # Opt in per test with @BdsIntegrationTest(properties = "bds.test.elasticsearch=true").
      enabled: false
  analytics:
    ingestion:
      # Off by default in the application (kill switch until S5's rate-limit policy exists); tests exercise it.
      enabled: true
