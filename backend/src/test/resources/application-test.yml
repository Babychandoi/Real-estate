spring:
  datasource:
    url: jdbc:h2:mem:bds_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  billing:
    quota-enforced: false
  listing:
    require-verified-kyc: false
  mode: test
  features:
    real-kyc: true
    real-transactions: true
  data:
    redis:
      host: localhost
      port: 6379
