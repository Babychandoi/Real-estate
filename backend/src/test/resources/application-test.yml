spring:
  datasource:
    url: jdbc:h2:mem:bds_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  billing:
    quota-enforced: false
  listing:
    require-verified-kyc: false
  mode: test
  security:
    rate-limit:
      # Every MockMvc request comes from 127.0.0.1, so unrelated suites would share one IP budget. The rate-limit
      # suites (shared.security.RequestRateLimit*Tests) set this back to 1 and test the real limits.
      limit-multiplier: 1000
  features:
    real-kyc: true
    real-transactions: true
  data:
    redis:
      host: localhost
      port: 6379
